<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colección | Madera & Diseño</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layouts.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/motion.css">
    
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px; /* Margen super fino estilo galería */
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 3/4;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s var(--ease-out-expo), filter 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
            filter: brightness(0.7);
        }
        .gallery-overlay {
            position: absolute;
            bottom: var(--space-m);
            left: var(--space-m);
            color: #fff;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s var(--ease-out-expo);
        }
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <header class="header" style="mix-blend-mode: normal; color: var(--clr-dark);">
        <a href="index.html" class="nav__logo">
            <img src="assets/img/logo.jpg" alt="Logo" style="filter: none;" />
        </a>
        <nav>
            <ul class="nav__list">
                <li><a href="taller.html" class="nav__link">El Taller</a></li>
                <li><a href="coleccion.html" class="nav__link">Colección</a></li>
                <li><a href="contacto.html" class="nav__link">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding-top: var(--space-xxl);">
        <section class="container" style="padding-bottom: var(--space-xl);">
            <h1 class="fade-in-up" style="font-size: var(--text-h2); margin-bottom: var(--space-l);">Obras Destacadas</h1>
            
            <div class="gallery-grid fade-in-up">
                <div class="gallery-item">
                    <img src="assets/img/hero.jpg" alt="Mesa Comedor">
                    <div class="gallery-overlay">
                        <h3 style="font-family: var(--font-body); font-weight: 400; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em;">Mesa de Roble "Odin"</h3>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="assets/img/port1.jpg" alt="Silla">
                    <div class="gallery-overlay">
                        <h3 style="font-family: var(--font-body); font-weight: 400; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em;">Silla "Arco" (Nogal)</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
